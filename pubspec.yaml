name: easy_localization_continued
description: "Maintained fork of easy_localization 3.0.9: fast JSON translations, plurals, linked keys, codegen and a single awaitable localization owner for Flutter."
homepage: https://github.com/Anfet/easy_localization
repository: https://github.com/Anfet/easy_localization
issue_tracker: https://github.com/Anfet/easy_localization/issues
topics: [localization, i18n, l10n, internationalization]
# publish_to: none

version: 4.0.0

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: '>=2.5.6 <3.0.0'
  intl: ^0.20.2
  meta: ^1.18.0
  args: ^2.3.1
  path: ^1.8.1
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.0.0
