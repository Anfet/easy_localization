name: Test

on:
  workflow_call:
    inputs:
      use_self_hosted:
        description: Run on the owner's self-hosted macOS runner instead of GitHub-hosted Ubuntu.
        type: boolean
        default: false

jobs:
  test:
    name: Test
    runs-on: ${{ inputs.use_self_hosted && fromJSON('["self-hosted","macOS","X64"]') || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@v4

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: "3.44.9"

    - name: Install packages dependencies
      run: flutter pub get

    - name: Analyze the project's Dart code
      run: flutter analyze lib bin test

    - name: Check Dart formatting
      run: dart format --output=none --set-exit-if-changed --line-length 150 lib bin

    - name: Run tests
      timeout-minutes: 10
      run: flutter test

    - name: Install example dependencies
      working-directory: example
      run: flutter pub get

    - name: Analyze example code
      working-directory: example
      run: flutter analyze lib test

    - name: Run example smoke test
      timeout-minutes: 10
      working-directory: example
      run: flutter test test/widget_test.dart

    - name: Run example layout test
      timeout-minutes: 10
      working-directory: example
      run: flutter test test/localization_layout_test.dart

    - name: Run example linked assets test
      timeout-minutes: 10
      working-directory: example
      run: flutter test test/linked_assets_test.dart

    - name: Check package publication
      run: |
        git restore --source=HEAD --worktree -- example/linux/flutter/generated_plugins.cmake
        git diff --exit-code HEAD --
        flutter pub publish --dry-run
